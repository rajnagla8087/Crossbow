<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#162033" />
      <stop offset="60%" stop-color="#0f1624" />
      <stop offset="100%" stop-color="#080b11" />
    </radialGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="6"/>

  <!-- Radar/Crosshairs Network Rings -->
  <circle cx="256" cy="256" r="180" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="120" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2.5" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="60" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

  <!-- Crosshairs Axes -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Crossbow Arc (Bow) -->
  <path d="M100 340 C140 140, 372 140, 412 340" fill="none" stroke="url(#neonCyan)" stroke-width="32" stroke-linecap="round" filter="url(#glowHeavy)"/>

  <!-- Bowstring -->
  <path d="M100 340 L256 420 L412 340" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="14 8" opacity="0.85"/>

  <!-- Crossbow Bolt / Arrow Shaft -->
  <line x1="256" y1="420" x2="256" y2="80" stroke="url(#neonCyan)" stroke-width="26" stroke-linecap="round" filter="url(#glowHeavy)"/>

  <!-- Spear Arrowhead -->
  <polygon points="256,40 200,140 256,110 312,140" fill="url(#neonCyan)" filter="url(#glowHeavy)"/>

  <!-- Speech Bubble Nodes (Translation Symbolism) -->
  <circle cx="160" cy="200" r="28" fill="#162033" stroke="url(#neonEmerald)" stroke-width="8" filter="url(#glowSubtle)"/>
  <text x="160" y="208" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" fill="#34d399" text-anchor="middle">A</text>

  <circle cx="352" cy="200" r="28" fill="#162033" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glowSubtle)"/>
  <text x="352" y="208" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" fill="#00f2fe" text-anchor="middle">文</text>
</svg>
