version: '3.8'

services:
  crossbow-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossbow-translator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
